<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MT.GAKA Ticket Control</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
    margin: 0;
    width: 100%;
    height: 100vh;
    min-height: 100vh;
    overflow: hidden;
    background: #080808;
    color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

        .container {
    width: 100%;
    max-width: 430px;
    text-align: center;
    transform: translateY(-5px);
}

        .logo {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 3px;
    margin-bottom: 3px;
}

        .subtitle {
    font-size: 12px;
    letter-spacing: 2px;
    opacity: 0.65;
    margin-bottom: 20px;
}

        .scanner-box {
    width: 100%;
    border: 1px solid #333;
    border-radius: 18px;
    padding: 15px;
    background: #111;
}

        .scanner-icon {
    font-size: 42px;
    margin-bottom: 10px;
}

        h2 {
            margin: 0 0 10px;
        }

        p {
    color: #aaa;
    font-size: 13px;
    line-height: 1.35;
    margin: 5px 0;
}

        input {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border-radius: 10px;
    border: 1px solid #444;
    background: #050505;
    color: white;
    font-size: 14px;
    text-align: center;
}

        button {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    border: none;
    border-radius: 10px;
    background: white;
    color: black;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
}

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        button:active {
            transform: scale(0.98);
        }

        .result {
    display: none;
    margin-top: 12px;
    padding: 15px 10px;
    border-radius: 15px;
    font-weight: bold;
}

        .valid {
            display: block;
            background: #123d22;
            border: 1px solid #2ecc71;
        }

        .used {
            display: block;
            background: #401515;
            border: 1px solid #e74c3c;
        }

        .ticket-id {
            margin-top: 12px;
            font-size: 14px;
            word-break: break-all;
            opacity: 0.9;
        }

        .status {
            font-size: 26px;
            margin-top: 8px;
        }

        .test-note {
    margin-top: 10px;
    font-size: 10px;
    color: #666;
}
    </style>
</head>

<body>

<div class="container">

    <div class="logo">MT.GAKA</div>

    <div class="subtitle">
        CHALLENGE DAY · TICKET CONTROL
    </div>

    <div class="scanner-box">

        <div class="scanner-icon">▣</div>

        <h2>Contrôle du billet</h2>

        <p>
            Scannez le PDF417 ou saisissez manuellement
            l'identifiant du billet.
        </p>

        <input
            id="ticketInput"
            type="text"
            placeholder="Scanner le billet ici"
            autocomplete="off"
        >

        <button id="checkButton" onclick="checkTicket()">
            VÉRIFIER LE TICKET
        </button>

        <div id="result" class="result"></div>

    </div>

    <div class="test-note">
        SUPABASE · TEST MODE · MT.GAKA CHALLENGE DAY
    </div>

</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
    "https://hfucvtipxcenhklxasro.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_U_5Ez8S4rg9nwMMa_Uzv_A_ixq5iKA3";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function getTicketFromURL() {

    const url = new URL(window.location.href);

    let ticket =
        url.searchParams.get("ticket");

    if (!ticket && url.hash) {

        const hash =
            url.hash.substring(1);

        const hashParams =
            new URLSearchParams(hash);

        ticket =
            hashParams.get("ticket");
    }

    if (!ticket) {
        return null;
    }

    return decodeURIComponent(ticket)
        .trim()
        .toUpperCase();

}


async function checkTicket(ticketFromURL = null) {

    const inputElement =
        document.getElementById("ticketInput");

    const result =
        document.getElementById("result");


    let input = "";


    if (ticketFromURL) {

        input =
            ticketFromURL
                .trim()
                .toUpperCase();

        inputElement.value =
            input;

    } else {

        input =
            inputElement.value
                .trim()
                .toUpperCase();

    }


    if (!input) {

        result.className =
            "result invalid";

        result.style.display =
            "block";

        result.innerHTML = `
            ❌<br>

            <div class="status">
                IDENTIFIANT MANQUANT
            </div>

            <div style="margin-top:10px;">
                Veuillez saisir ou scanner le billet.
            </div>
        `;

        return;
    }


    result.className =
        "result";

    result.style.display =
        "block";

    result.innerHTML = `
        ⏳<br>

        <div class="status">
            VÉRIFICATION...
        </div>
    `;


    try {

        const { data, error } =
            await supabaseClient.rpc(
                "redeem_ticket",
                {
                    p_ticket_code: input
                }
            );


        if (error) {
            throw error;
        }


        if (!data || data.length === 0) {

            result.className =
                "result invalid";

            result.innerHTML = `
                ❌<br>

                <div class="status">
                    TICKET INCONNU
                </div>

                <div style="margin-top:10px;">
                    ${escapeHtml(input)}
                </div>
            `;

            return;
        }


        const ticket =
            data[0];


        if (ticket.status === "VALID") {

            result.className =
                "result valid";

            result.innerHTML = `
                ✅<br>

                <div class="status">
                    TICKET VALIDE
                </div>

                <div style="margin-top:12px;">
                    <strong>EINGELÖST</strong>
                </div>

                <div style="margin-top:12px;">
                    ${escapeHtml(ticket.ticket_code)}
                </div>

                <div style="margin-top:8px;">
                    ${escapeHtml(ticket.ticket_type)}
                </div>
            `;

            return;
        }


        if (ticket.status === "ALREADY_USED") {

            result.className =
                "result invalid";

            result.innerHTML = `
                ⚠️<br>

                <div class="status">
                    DÉJÀ UTILISÉ
                </div>

                <div style="margin-top:12px;">
                    <strong>BEREITS EINGELÖST</strong>
                </div>

                <div style="margin-top:12px;">
                    ${escapeHtml(ticket.ticket_code)}
                </div>
            `;

            return;
        }

    } catch (error) {

        result.className =
            "result invalid";

        result.innerHTML = `
            ❌<br>

            <div class="status">
                ERREUR DE CONNEXION
            </div>

            <div style="
                margin-top:12px;
                font-size:12px;
                word-break:break-word;
            ">
                ${escapeHtml(
                    error.message ||
                    "Erreur inconnue"
                )}
            </div>
        `;
    }

}


window.addEventListener(
    "load",
    function () {

        const ticket =
            getTicketFromURL();

        if (ticket) {

            checkTicket(ticket);

        }

    }
);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MT.GAKA Ticket Control</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #080808;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            text-align: center;
        }

        .logo {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 13px;
            letter-spacing: 3px;
            opacity: 0.65;
            margin-bottom: 35px;
        }

        .scanner-box {
            border: 1px solid #333;
            border-radius: 20px;
            padding: 25px;
            background: #111;
        }

        .scanner-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h2 {
            margin: 0 0 10px;
        }

        p {
            color: #aaa;
            font-size: 14px;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 17px;
            margin-top: 20px;
            border-radius: 10px;
            border: 1px solid #444;
            background: #050505;
            color: white;
            font-size: 15px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 17px;
            margin-top: 12px;
            border: none;
            border-radius: 10px;
            background: white;
            color: black;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        button:active {
            transform: scale(0.98);
        }

        .result {
            display: none;
            margin-top: 20px;
            padding: 25px 15px;
            border-radius: 15px;
            font-weight: bold;
        }

        .valid {
            display: block;
            background: #123d22;
            border: 1px solid #2ecc71;
        }

        .used {
            display: block;
            background: #401515;
            border: 1px solid #e74c3c;
        }

        .ticket-id {
            margin-top: 12px;
            font-size: 14px;
            word-break: break-all;
            opacity: 0.9;
        }

        .status {
            font-size: 26px;
            margin-top: 8px;
        }

        .test-note {
            margin-top: 25px;
            font-size: 11px;
            color: #666;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">MT.GAKA</div>

    <div class="subtitle">
        CHALLENGE DAY · TICKET CONTROL
    </div>

    <div class="scanner-box">

        <div class="scanner-icon">▣</div>

        <h2>Contrôle du billet</h2>

        <p>
            Scannez le PDF417 ou saisissez manuellement
            l'identifiant du billet.
        </p>

        <input
            id="ticketInput"
            type="text"
            placeholder="MTGAKA-STD-0001-20261224"
            autocomplete="off"
        >

        <button id="checkButton" onclick="checkTicket()">
            VÉRIFIER LE TICKET
        </button>

        <div id="result" class="result"></div>

    </div>

    <div class="test-note">
        SUPABASE · TEST MODE · MT.GAKA CHALLENGE DAY
    </div>

</div>


<!-- SUPABASE -->
<script>
const SUPABASE_URL =
    "https://hfucvtipxcenhklxasro.supabase.co";
const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_U_5Ez8S4rg9nwMMa_Uzv_A_ix5q1iKA3";
const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );
/*
 * Ticket automatisch aus der URL lesen
 *
 * Beispiel:
 * ticket-control.html?ticket=MTGAKA-STD-0001-20261224
 */
function getTicketFromURL() {

    // Variante 1: ?ticket=...
    const params =
        new URLSearchParams(window.location.search);

    let ticket =
        params.get("ticket");


    // Variante 2: #ticket=...
    if (!ticket && window.location.hash) {

        const hash =
            window.location.hash.substring(1);

        const hashParams =
            new URLSearchParams(hash);

        ticket =
            hashParams.get("ticket");
    }


    if (!ticket) {
        return null;
    }


    return ticket
        .trim()
        .toUpperCase();
}
/*
 * Ticket prüfen
 */
async function checkTicket(ticketFromURL = null) {
    const inputElement =
        document.getElementById("ticketInput");
    const result =
        document.getElementById("result");
    const button =
        document.getElementById("checkButton");
    /*
     * Wenn Ticket aus der URL kommt,
     * wird es automatisch eingesetzt.
     */
    if (ticketFromURL) {
        inputElement.value = ticketFromURL;
    }
    const input =
        inputElement.value
            .trim()
            .toUpperCase();
    result.className = "result";
    result.innerHTML = "";
    if (!input) {
        result.innerHTML = `
            ⚠️<br>
            <div class="status">
                IDENTIFIANT MANQUANT
            </div>
            <div class="ticket-id">
                Veuillez saisir ou scanner le billet.
            </div>
        `;
        result.classList.add("used");
        return;
    }
    button.disabled = true;
    button.textContent = "VÉRIFICATION...";
    try {
        const { data, error } =
            await supabaseClient.rpc(
                "redeem_ticket",
                {
                    p_ticket_code: input
                }
            );
        /*
         * Supabase Fehler
         */
        if (error) {
            console.error(error);
            result.innerHTML = `
                ⚠️<br>
                <div class="status">
                    ERREUR
                </div>
                <div class="ticket-id">
                    ${escapeHtml(
                        error.message ||
                        "Erreur inconnue"
                    )}
                </div>
                <div style="margin-top:12px; font-size:12px; opacity:0.75;">
                    ${escapeHtml(
                        error.details || ""
                    )}
                </div>
            `;
            result.classList.add("used");
            return;
        }
        /*
         * Kein Ergebnis = Ticket existiert nicht
         */
        if (!data || data.length === 0) {
            result.innerHTML = `
                ❌<br>
                <div class="status">
                    TICKET INVALIDE
                </div>
                <div class="ticket-id">
                    ${escapeHtml(input)}
                </div>
            `;
            result.classList.add("used");
            return;
        }
        const ticket = data[0];
        /*
         * Ticket bereits verwendet
         */
        if (ticket.status === "ALREADY_USED") {
            result.innerHTML = `
                🚫<br>
                <div class="status">
                    DÉJÀ UTILISÉ
                </div>
                <div class="ticket-id">
                    ${escapeHtml(
                        ticket.ticket_code
                    )}
                </div>
                <div style="margin-top:12px;">
                    BEREITS EINGELÖST
                </div>
            `;
            result.classList.add("used");
            return;
        }
        /*
         * Ticket erfolgreich eingelöst
         */
        if (ticket.status === "VALID") {
            result.innerHTML = `
                ✅<br>
                <div class="status">
                    TICKET VALIDE
                </div>
                <div class="ticket-id">
                    ${escapeHtml(
                        ticket.ticket_code
                    )}
                </div>
                <div style="margin-top:12px;">
                    EINGELÖST
                </div>
                <div style="margin-top:8px; font-size:12px; opacity:0.75;">
                    ${escapeHtml(
                        ticket.ticket_type
                    )}
                </div>
            `;
            result.classList.add("valid");
            return;
        }
        /*
         * Unerwarteter Status
         */
        result.innerHTML = `
            ⚠️<br>
            <div class="status">
                STATUT INCONNU
            </div>
        `;
        result.classList.add("used");
    }
    catch (error) {

    console.error("TICKET CONTROL ERROR:", error);

    result.innerHTML = `
        ⚠️<br>

        <div class="status">
            ERREUR
        </div>

        <div class="ticket-id">
            ${escapeHtml(
                error?.message ||
                "Erreur inconnue"
            )}
        </div>

        <div style="margin-top:12px; font-size:12px; opacity:0.75;">
            ${escapeHtml(
                error?.details ||
                error?.hint ||
                ""
            )}
        </div>
    `;

    result.classList.add("used");
}
    finally {
        button.disabled = false;
        button.textContent = "VÉRIFIER LE TICKET";
    }
}
/*
 * Automatischer Start
 *
 * Wenn die URL ?ticket=... enthält,
 * wird das Ticket sofort geprüft.
 */
window.addEventListener("load", function () {

    const ticket = getTicketFromURL();

    if (ticket) {
        checkTicket(ticket);
    }

});
/*
 * Schutz gegen HTML-Injection
 */
function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
</script>

</body>
</html>

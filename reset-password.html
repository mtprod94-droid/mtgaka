<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialiser le mot de passe | MT.GAKA</title>
    <style>
        * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: #080808;
        color: #f5f5f5;
        font-family: Arial, sans-serif;
    }
    .card {
        width: 100%;
        max-width: 420px;
        padding: 28px;
        border: 1px solid #b89443;
        border-radius: 14px;
        background: #151515;
    }
    h1 {
        color: #d4af57;
        font-size: 25px;
        text-align: center;
    }
    p {
        color: #ccc;
        line-height: 1.5;
    }
    label {
        display: block;
        margin-top: 18px;
        margin-bottom: 7px;
    }
    input, button {
        width: 100%;
        min-height: 48px;
        padding: 12px;
        border-radius: 7px;
        font-size: 16px;
    }
    input {
        border: 1px solid #777;
        background: #080808;
        color: white;
    }
    button {
        margin-top: 22px;
        border: 0;
        background: #d4af57;
        color: #111;
        font-weight: bold;
    }
    button:disabled {
        opacity: .6;
    }
    #message {
        margin-top: 18px;
        overflow-wrap: anywhere;
    }
    .success { color: #7ee2a8; }
    .error { color: #ff8585; }
</style>
</head>
<body>
    <main class="card">
        <h1>MT.GAKA</h1>
        <p>Réinitialisation du mot de passe</p>
        <p>Choisissez un nouveau mot de passe pour votre compte du personnel.</p>
    <form id="resetForm">
        <label for="password">Nouveau mot de passe</label>
        <input
            id="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
            placeholder="8 caractères minimum"
        >
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
            placeholder="Répétez le mot de passe"
        >
        <button id="submitButton" type="submit">
            ENREGISTRER LE NOUVEAU MOT DE PASSE
        </button>
    </form>
    <div id="message" role="status" aria-live="polite"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL =
        "https://hfucvtipxcenhklxasro.supabase.co";
    // Utilisez uniquement la clé publique anon/publishable du projet.
    // Ne mettez jamais une clé service_role dans ce fichier.
    const SUPABASE_ANON_KEY = "sb_publishable_U_5Ez8S4rg9nwMMa_Uzv_A_ixq5iKA3";
    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );
    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submitButton");
    async function initializeRecovery() {
const message = document.getElementById(“message”);
const form = document.getElementById(“resetForm”);

message.className = "";
message.textContent = "Vérification du lien de récupération…";
const { data, error } = await supabaseClient.auth.getSession();
if (error || !data.session) {
    form.style.display = "none";
    message.className = "error";
    message.textContent =
        "Le lien de récupération est invalide ou expiré. " +
        "Demandez un nouvel e-mail de réinitialisation.";
    return;
}
form.style.display = "block";
message.className = "success";
message.textContent =
    "Lien vérifié. Vous pouvez choisir votre nouveau mot de passe.";

}
    form.addEventListener("submit", async function (event) {
        event.preventDefault();
        const password =
            document.getElementById("password").value;
        const confirmation =
            document.getElementById("confirmPassword").value;
        if (password.length < 8) {
            message.className = "error";
            message.textContent =
                "Le mot de passe doit contenir au moins 8 caractères.";
            return;
        }
        if (password !== confirmation) {
            message.className = "error";
            message.textContent =
                "Les deux mots de passe ne correspondent pas.";
            return;
        }
        button.disabled = true;
        message.className = "";
        message.textContent = "Enregistrement en cours…";
        try {
            const { error } =
                await supabaseClient.auth.updateUser({ password });
            if (error) throw error;
            message.className = "success";
            message.textContent =
                "Mot de passe modifié avec succès. " +
                "Vous pouvez maintenant vous connecter au contrôle des billets.";
            form.reset();
        } catch (error) {
            message.className = "error";
            message.textContent =
                error.message ||
                "Impossible de modifier le mot de passe.";
        } finally {
            button.disabled = false;
        }
    });
    initializeRecovery();
</script>
</body>
</html>
